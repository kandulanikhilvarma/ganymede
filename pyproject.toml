[project]
name = "ganymede"
version = "0.1.0"
description = "Recovery Intelligence System: risk and coaching over one loop"
requires-python = ">=3.11"

# What the package actually imports. Previously this listed five of them while
# requirements.txt listed ten, so `pip install -e .` produced an environment
# that could not run the evals or read a .env file.
dependencies = [
    "pydantic>=2.6",
    "polars>=1.44.1",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "krippendorff>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
# OpenRouter is reached through the OpenAI-compatible client. The Anthropic
# models appear as route strings ("anthropic/claude-sonnet-5"), not as an import,
# so the anthropic package was never a dependency.
llm = ["openai>=1.40"]
charts = ["matplotlib>=3.8"]
# Transcoding source recordings to 16 kHz mono. The VAD itself is in-house over
# `wave` and numpy, so faster-whisper and silero-vad are not dependencies either.
audio = ["imageio-ffmpeg>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
