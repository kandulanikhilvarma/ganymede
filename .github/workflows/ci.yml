name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: invariants
        run: python -m ganymede.invariants --check
      - name: tests
        run: python -m pytest -q
