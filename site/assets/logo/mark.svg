<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ganymede">
  <!-- The terminator line: a moon in phase, where the day/night boundary is not a
       clean arc but a bent trajectory. The wobble is the mark. -->
  <defs>
    <clipPath id="gm-disc"><circle cx="16" cy="16" r="14"/></clipPath>
  </defs>
  <circle cx="16" cy="16" r="14" fill="currentColor" opacity=".18"/>
  <path d="M16 2C8.4 8.6 23.6 21.4 16 30L31 30L31 2Z" clip-path="url(#gm-disc)" fill="currentColor"/>
  <path d="M16 2C8.4 8.6 23.6 21.4 16 30" clip-path="url(#gm-disc)"
        fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
</svg>
